name: Docker CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  node:
    runs-on: wsl-linux

    steps:
      - name: Clone code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f Dockerfile.distroless -t dockerfile-distroless .

      - name: Tag and Push Docker image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag dockerfile-distroless ${{ vars.DOCKERHUB_USERNAME }}/nodeapp8:$SHORT_SHA
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp8:$SHORT_SHA
